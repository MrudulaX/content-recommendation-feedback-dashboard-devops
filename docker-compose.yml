# =============================================================================
# Content Recommendation Feedback Dashboard - local / staging stack
#
#   docker compose up -d --build
#   Dashboard   : http://localhost:8081   (through Nginx)
#   App direct  : http://localhost:8080
#   Swagger UI  : http://localhost:8080/swagger-ui/index.html
#   H2 console  : http://localhost:8080/h2-console
#
#   docker compose logs -f app
#   docker compose down            # stop and remove containers
#   docker compose down -v         # also remove the data volume
# =============================================================================

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: "1.0.0"
        BUILD_REVISION: "${BUILD_REVISION:-local}"
    image: crfd:1.0.0
    container_name: crfd-app
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      CRFD_ENVIRONMENT: "docker-compose"
      CRFD_SIMULATION_ENABLED: "true"
      CRFD_SEED_ON_STARTUP: "true"
      CRFD_METRICS_WINDOW_HOURS: "24"
      CRFD_HIGH_LATENCY_MS: "500"
      CRFD_CRITICAL_LATENCY_MS: "1500"
      DB_URL: "jdbc:h2:file:/app/crfd-data/crfd;DB_CLOSE_ON_EXIT=FALSE"
      JAVA_OPTS: "-XX:MaxRAMPercentage=70 -XX:+UseContainerSupport"
    volumes:
      - crfd-data:/app/crfd-data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 50s
      retries: 5
    networks:
      - crfd-net

  nginx:
    image: nginx:1.27-alpine
    container_name: crfd-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"
    networks:
      - crfd-net

networks:
  crfd-net:
    # Pinned name: the Selenium overlay (infra/selenium/) joins this same network,
    # and the browser container addresses the app as http://crfd-app:8080.
    name: crfd-net
    driver: bridge

volumes:
  crfd-data:
    driver: local
