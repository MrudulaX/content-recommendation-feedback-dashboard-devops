# =============================================================================
# Optional MySQL-backed stack (staging / production shape).
#
#   docker compose -f docker-compose.mysql.yml up -d --build
#
# Demonstrates the same application artefact running against an external
# database instead of the embedded H2 file - no code change, configuration only.
# =============================================================================

services:

  db:
    image: mysql:8.4
    container_name: crfd-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: crfd
      MYSQL_USER: crfd
      MYSQL_PASSWORD: crfd
      MYSQL_ROOT_PASSWORD: root
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=caching_sha2_password
    volumes:
      - crfd-mysql:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucrfd", "-pcrfd"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "3306:3306"
    networks:
      - crfd-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: crfd:1.0.0-mysql
    container_name: crfd-app-mysql
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: "mysql"
      SERVER_PORT: "8080"
      CRFD_ENVIRONMENT: "docker-mysql"
      CRFD_SIMULATION_ENABLED: "false"
      CRFD_SEED_ON_STARTUP: "false"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_NAME: "crfd"
      DB_USER: "crfd"
      DB_PASSWORD: "crfd"
    ports:
      - "8080:8080"
    networks:
      - crfd-net

  nginx:
    image: nginx:1.27-alpine
    container_name: crfd-nginx-mysql
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"
    networks:
      - crfd-net

networks:
  crfd-net:
    driver: bridge

volumes:
  crfd-mysql:
    driver: local
