# =============================================================================
#  GitHub Actions mirror of the Jenkins pipeline.
#
#  Jenkins is the pipeline of record for this project (it is what the brief
#  asks for, and doc 08 walks through the job configuration). This workflow
#  exists so that every push and pull request is validated on GitHub itself,
#  which keeps the review gate honest even when the Jenkins controller is not
#  running: branch protection can require it.
#
#  Both pipelines deliberately run the SAME quality gates:
#    compile -> unit + integration tests -> package -> container build ->
#    Selenium journeys against a real container -> publish test reports
# =============================================================================
name: CRFD CI

on:
  push:
    branches: [main, develop, "feature/**", "bugfix/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_selenium:
        description: Run the Selenium end-to-end journeys
        type: boolean
        default: true

concurrency:
  group: crfd-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  JAVA_VERSION: "21"
  IMAGE_NAME: crfd

jobs:

  # ---------------------------------------------------------------- build ----
  build-and-test:
    name: Build & test (JDK ${{ env.JAVA_VERSION }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build metadata
        run: |
          echo "COMMIT_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BRANCH=$(git rev-parse --abbrev-ref HEAD)"    >> "$GITHUB_ENV"

      - name: Compile and run the unit + integration tests
        run: mvn -B -U clean verify -DskipITs

      - name: Publish the test summary
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: target/surefire-reports/*.xml
          check_name: Unit & integration tests
          detailed_summary: true
          include_passed: true

      - name: Archive the test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/**
            target/site/jacoco/**
          retention-days: 14
          if-no-files-found: warn

      - name: Add the coverage summary to the run
        if: always()
        run: |
          {
            echo "## Test & coverage summary"
            echo ""
            echo "- Commit: \`$COMMIT_SHORT\` on \`$BRANCH\`"
            echo "- Unit/integration report: see the **test-reports** artifact"
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------- image ----
  container-image:
    name: Container image build
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            APP_VERSION=1.0.0-SNAPSHOT
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image starts and reports healthy
        run: |
          docker run -d --name crfd-ci -p 8080:8080 \
            -e CRFD_ENVIRONMENT=ci \
            -e CRFD_SEED_ON_STARTUP=true \
            -e CRFD_SIMULATION_ENABLED=true \
            "${{ env.IMAGE_NAME }}:${{ github.sha }}"

          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/health | grep -q '"database":"UP"'; then
              echo "application is ready after ${i} attempt(s)"
              curl -fsS http://localhost:8080/api/v1/health
              exit 0
            fi
            sleep 3
          done

          echo "::error::the container never became ready"
          docker logs crfd-ci
          exit 1

      - name: Capture the container log
        if: always()
        run: docker logs crfd-ci > container.log 2>&1 || true

      - name: Tear the container down
        if: always()
        run: docker rm -f crfd-ci || true

      - name: Archive the container log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-log
          path: container.log
          if-no-files-found: warn

  # ------------------------------------------------------------- e2e ---------
  selenium-journeys:
    name: Selenium end-to-end journeys
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_selenium }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Docker build outputs are not shared between jobs, and a job's `services:`
      # block can only use images that already exist, so this job builds the
      # application and starts it itself. A real browser does the driving, so the
      # journey is genuinely end to end rather than a mocked render.
      - name: Package the application
        run: mvn -B -DskipTests package

      - name: Start the application
        run: |
          nohup java -jar target/content-recommendation-feedback-dashboard.jar \
            --server.port=8080 \
            --crfd.environment=ci \
            --crfd.simulation.seed-on-startup=true \
            --crfd.simulation.enabled=true > app.log 2>&1 &
          bash scripts/wait-for-health.sh "http://localhost:8080/api/v1/health" 120 '"database":"UP"'

      - name: Run the Selenium journeys
        run: mvn -B -P selenium verify -Dselenium.baseUrl=http://localhost:8080 -Dselenium.headless=true

      - name: Publish the journey results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: target/failsafe-reports/*.xml
          check_name: Selenium end-to-end journeys
          detailed_summary: true

      - name: Archive failure screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-evidence
          path: |
            target/selenium-screenshots/**
            target/failsafe-reports/**
            app.log
          retention-days: 14
          if-no-files-found: warn
