# =============================================================================
#  Jenkins Configuration as Code (JCasC) for the CRFD project.
#  Mounted at $JENKINS_HOME/casc/jenkins.yaml.
#
#  Reproduces, from source control:
#    * the JDK 21 and Maven 3.9 tool installations the Jenkinsfile references
#    * the Docker Hub credential placeholder used by the publish stage
#    * the seed job that creates the CRFD pipeline from the repository
#
#  SECURITY IS DELIBERATELY OFF on this local demo controller. The realm and
#  strategy below are kept, commented out, so they can be switched back on:
#    * JCasC re-applies this file on every boot, so leaving them enabled would
#      undo any `<useSecurity>false</useSecurity>` edit to config.xml, and
#      leaving them out means the controller comes up with no login at all.
#    * To restore the login: uncomment both blocks, set
#      `<useSecurity>true</useSecurity>` in $JENKINS_HOME/config.xml, and
#      restart the container.
# =============================================================================

jenkins:
  systemMessage: "Content Recommendation Feedback Dashboard - end-to-end CI/CD (build, Selenium quality gate, Docker, Ansible)."
  numExecutors: 2
  mode: NORMAL

  # securityRealm:
  #   local:
  #     allowsSignup: false
  #     users:
  #       - id: "${JENKINS_ADMIN_ID:-admin}"
  #         password: "${JENKINS_ADMIN_PASSWORD:-crfd-admin}"
  #         name: "CRFD Administrator"
  #
  # authorizationStrategy:
  #   loggedInUsersCanDoAnything:
  #     allowAnonymousRead: false

  # Crumb issuer deliberately left at the defaults: the historical
  # `standard: excludeClientIPFromCrumb` attribute was removed from
  # DefaultCrumbIssuer, and JCasC now treats an unknown attribute as a fatal
  # boot error rather than a warning.

  # The pipeline runs with `agent any`, so it needs no custom node labels. A
  # permanent node called "built-in" is rejected outright - that id belongs to
  # the controller's own node.

  quietPeriod: 2
  scmCheckoutRetryCount: 3

  clouds:
    - docker:
        name: "crfd-docker"
        dockerApi:
          dockerHost:
            uri: "unix:///var/run/docker.sock"
        templates:
          - labelString: "crfd-builder"
            dockerTemplateBase:
              image: "maven:3.9.9-eclipse-temurin-21"
            instanceCapStr: "2"
            remoteFs: "/home/jenkins/agent"

tool:
  git:
    installations:
      - name: "Default"
        home: "git"
  jdk:
    installations:
      # Declared by local home: the image already ships Temurin 21 at this path,
      # and the adoptOpenJdk installer that used to fetch it needs the `jdks`
      # plugin, which is no longer published.
      - name: "JDK21"
        home: "/opt/java/openjdk"
  maven:
    installations:
      - name: "M3"
        properties:
          - installSource:
              installers:
                - maven:
                    id: "3.9.9"

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "github-crfd"
              username: "crfd-ci"
              password: "REPLACE_WITH_A_GITHUB_PAT"
              description: "GitHub access for the CRFD repository (replace or use a token credential)"
          - usernamePassword:
              scope: GLOBAL
              id: "dockerhub-credentials"
              username: "REPLACE_WITH_DOCKERHUB_USER"
              password: "REPLACE_WITH_DOCKERHUB_TOKEN"
              description: "Docker Hub push credentials used by the 'Publish image' stage"

unclassified:
  location:
    url: "http://localhost:8085/"
    adminAddress: "crfd-team@example.com"
  timestamper:
    allPipelines: true
  buildDiscarders:
    configuredBuildDiscarders:
      - "jobBuildDiscarder"

jobs:
  - script: |
      // -----------------------------------------------------------------------
      // Seed job: registers the CRFD pipeline straight from the Jenkinsfile in
      // the repository, so the job definition itself is version controlled.
      // -----------------------------------------------------------------------
      pipelineJob('crfd-dashboard-pipeline') {

        description('''Content Recommendation Feedback Dashboard - full DevOps pipeline.
                       Checkout -> unit test -> package -> Docker build -> Selenium
                       quality gate -> reports -> publish -> deploy -> health -> Ansible.''')

        // Parameters are deliberately NOT duplicated here. The Jenkinsfile owns
        // them, and `lightweight(false)` below means Jenkins checks the file out
        // to read them, so the job is parameterised from the moment it is seeded.
        // Declaring them in both places lets the two definitions drift, and the
        // Jenkinsfile's copy silently wins at build time - a difference that is
        // discovered at the worst possible moment.

        // No triggers{} block here: Job DSL deprecated it for pipelineJob, and
        // the Jenkinsfile's own `triggers { pollSCM(...) }` is what Jenkins uses
        // once the job definition is loaded from SCM.

        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url(System.getenv('CRFD_REPO_URL') ?: 'https://github.com/your-org/content-recommendation-feedback-dashboard.git')
                  credentials('github-crfd')
                }
                branches(System.getenv('CRFD_REPO_BRANCH') ?: 'develop')
                extensions {
                  wipeOutWorkspace()
                  cloneOptions { timeout(10) }
                }
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(false)
          }
        }

        logRotator {
          numToKeep(20)
          artifactNumToKeep(10)
        }
      }
