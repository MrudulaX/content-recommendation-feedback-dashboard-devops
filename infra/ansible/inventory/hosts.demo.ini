; =============================================================================
;  Demo inventory: the disposable node started by scripts/ansible-demo.*.
;
;  This file intentionally contains *only* connection details.
;
;  Group variables declared here would lose to inventory/group_vars/all.yml,
;  which sets production values (registry pull, nginx enabled, simulation off).
;  Ansible's precedence puts an inventory file's [group:vars] below
;  inventory/group_vars/all.yml, so a demo override written here would be
;  silently ignored - the classic "why did it try to pull from Docker Hub?"
;  bug. The demo's overrides therefore live in inventory/demo-overrides.yml
;  and are applied with `-e @inventory/demo-overrides.yml`, because extra vars
;  are the highest-precedence source in Ansible and cannot be overridden by
;  anything accidental.
; =============================================================================

[appservers]
crfd-node ansible_host=crfd-node ansible_port=22 ansible_user=root ansible_password=crfd

[appservers:vars]
ansible_connection=ssh
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

[crfd:children]
appservers
