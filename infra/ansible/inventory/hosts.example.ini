; =============================================================================
;  Example inventory - copy to hosts.ini and edit, or pass with -i.
;
;  ansible-playbook -i inventory/hosts.example.ini playbooks/site.yml
; =============================================================================

[appservers]
; <host>          ansible_host=<address>
; crfd-prod-01    ansible_host=10.20.30.11  ansible_user=deploy

[appservers:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/crfd_deploy

[nginx]
; crfd-edge-01    ansible_host=10.20.30.21  ansible_user=deploy

[crfd:children]
appservers
nginx

[crfd:vars]
app_image=crfd
app_version=1.0.0
app_port=8080
app_environment=production
app_simulation_enabled=false
app_seed_on_startup=false
nginx_upstream_port=8080
