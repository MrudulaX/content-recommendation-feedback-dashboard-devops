# =============================================================================
#  provision.yml - bring a bare node to the "ready to host CRFD" state.
#  Creates the deploy user, the directory structure and a working Docker
#  engine, but does NOT deploy the application. Use it for golden images or
#  for pre-warming a node pool.
#
#    ansible-playbook -i inventory/hosts.ini playbooks/provision.yml
#    ansible-playbook -i inventory/hosts.ini playbooks/provision.yml --check --diff
# =============================================================================

- name: Provision bare nodes as CRFD container hosts
  hosts: crfd
  become: true
  gather_facts: true
  serial: "{{ provision_serial | default('100%') }}"
  any_errors_fatal: true

  roles:
    - role: common
      tags: [common, baseline]
    - role: docker
      tags: [docker, container-host]

  post_tasks:
    - name: Confirm the node can run containers
      ansible.builtin.command: docker run --rm hello-world
      register: hello_world
      changed_when: false
      retries: 3
      delay: 5
      until: hello_world.rc == 0

    - name: Show the smoke container output
      ansible.builtin.debug:
        msg: "{{ hello_world.stdout_lines | default([]) | select('search', 'Hello') | list }}"
