; =============================================================================
;  Ansible configuration for the CRFD project.
;
;  Kept in the repository so that every playbook run - locally, in Jenkins or
;  on a build node - behaves identically.
; =============================================================================

[defaults]
inventory            = ./inventory/hosts.ini
roles_path           = ./roles
collections_path     = ./collections:~/.ansible/collections:/usr/share/ansible/collections
host_key_checking    = False
retry_files_enabled  = False
stdout_callback      = yaml
forks                = 10
gathering            = smart
fact_caching         = jsonfile
fact_caching_connection = /tmp/ansible-facts
fact_caching_timeout = 3600
deprecation_warnings = False
interpreter_python   = auto_silent
display_skipped_hosts = False
show_custom_stats    = True

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
become_ask_pass = False

[ssh_connection]
pipelining     = True
ssh_args       = -o ControlMaster=auto -o ControlPersist=120s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
retries        = 5
