# =============================================================================
#  Selenium overlay: adds a standalone Chrome node to the CRFD compose stack so
#  the end-to-end suite can be run against the *deployed* stack, not just
#  against a developer's desktop browser.
#
#    docker compose -f docker-compose.yml \
#                   -f infra/selenium/docker-compose.selenium.yml up -d
#    scripts/run-selenium.sh compose
#
#  The browser reaches the application as http://crfd-app:8080 (network alias)
#  and nginx as http://crfd-nginx:80; the test runner reaches the hub at
#  http://localhost:4444 and can watch the session on http://localhost:7900.
# =============================================================================

services:

  selenium:
    image: selenium/standalone-chrome:4.25.0
    container_name: crfd-selenium
    restart: unless-stopped
    shm_size: 2g
    ports:
      - "4444:4444"   # WebDriver hub
      - "7900:7900"   # noVNC - watch the browser live while debugging
    environment:
      SE_NODE_MAX_SESSIONS: "2"
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
      SE_VNC_NO_PASSWORD: "1"
      SE_SCREEN_WIDTH: "1920"
      SE_SCREEN_HEIGHT: "1080"
    networks:
      - crfd-net

networks:
  crfd-net:
    name: crfd-net
    driver: bridge
