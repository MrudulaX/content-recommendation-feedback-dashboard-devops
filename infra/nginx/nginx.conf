# =============================================================================
# Nginx reverse proxy for the Content Recommendation Feedback Dashboard.
#
# Mounted into the nginx container as /etc/nginx/conf.d/default.conf.
# Provides:
#   /            -> the dashboard (Spring Boot / embedded Tomcat on app:8080)
#   /healthz     -> lightweight readiness probe used by orchestrators and Ansible
#   /api/        -> REST API (proxied, connection reuse enabled)
#
# Deployment target note: the application itself is deployed either as
#   * an embedded-Tomcat fat JAR (default, used by Docker), or
#   * a WAR inside an external Apache Tomcat ($CATALINA_HOME/webapps/crfd.war)
# In both cases Nginx sits in front as the single TLS/entry-point.
# =============================================================================

upstream crfd_app {
    server app:8080 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

# Basic abuse protection for the ingestion endpoint.
limit_req_zone $binary_remote_addr zone=crfd_ingest:10m rate=25r/s;

server {
    listen 80;
    server_name _;

    # ---------------------------------------------------------------- security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 4m;

    # ---------------------------------------------------------------- proxy defaults
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ---------------------------------------------------------------- health
    location = /healthz {
        access_log off;
        proxy_pass http://crfd_app/api/v1/health;
    }

    # ---------------------------------------------------------------- ingestion API
    location = /api/v1/events {
        limit_req zone=crfd_ingest burst=50 nodelay;
        proxy_pass http://crfd_app;
    }

    location = /api/v1/events/bulk {
        limit_req zone=crfd_ingest burst=20 nodelay;
        proxy_pass http://crfd_app;
    }

    # ---------------------------------------------------------------- static assets (cache)
    location ~* \.(css|js|svg|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        proxy_pass http://crfd_app;
    }

    # ---------------------------------------------------------------- everything else
    location / {
        proxy_pass http://crfd_app;
    }
}
